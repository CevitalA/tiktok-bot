  <style>
    :root {
      --bg-dark: #07080d;
      --bg-card: #0e1222;
      --bg-card-hover: #151a30;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-pink: #ff2e63;
      --accent-emerald: #00ff88;
      --accent-purple: #9d4edd;
      --accent-gold: #ffd700;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    body {
      background-color: var(--bg-dark);
      color: #f3f4f6;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(ellipse 65% 40% at 20% 0%, rgba(0, 242, 254, 0.12), transparent),
        radial-gradient(ellipse 65% 40% at 80% 0%, rgba(255, 46, 99, 0.12), transparent),
        radial-gradient(circle at 50% 100%, rgba(157, 78, 221, 0.1), transparent 60%);
      background-attachment: fixed;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 84px);
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Responsive Container */
    .app-container {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    @media (min-width: 768px) {
      .app-container {
        max-width: 1020px;
        padding: 16px 20px;
      }
    }

    /* Glass Effect */
    .glass {
      background: rgba(11, 14, 26, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 242, 254, 0.2);
    }

    /* 3D Modern Cards */
    .card-3d {
      background: linear-gradient(145deg, rgba(20, 26, 46, 0.95), rgba(12, 16, 28, 0.95));
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.12);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-3d:active {
      transform: scale(0.97);
    }

    /* Medium Aesthetic League Icon */
    .league-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      box-shadow: 0 6px 14px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.4);
      flex-shrink: 0;
      position: relative;
    }

    /* Tier Gradients */
    .tier-A-grad { background: linear-gradient(135deg, #ff2e63, #ff0844); }
    .tier-B-grad { background: linear-gradient(135deg, #00f2fe, #0066ff); }
    .tier-C-grad { background: linear-gradient(135deg, #00ff88, #00b368); color: #052e16 !important; text-shadow: none !important; }
    .tier-D-grad { background: linear-gradient(135deg, #b5179e, #7209b7); }

    .tier-A-border { border-color: rgba(255, 46, 99, 0.45) !important; }
    .tier-B-border { border-color: rgba(0, 242, 254, 0.45) !important; }
    .tier-C-border { border-color: rgba(0, 255, 136, 0.45) !important; }
    .tier-D-border { border-color: rgba(181, 23, 158, 0.45) !important; }

    .tier-A-glow { box-shadow: 0 0 16px rgba(255, 46, 99, 0.4); }
    .tier-B-glow { box-shadow: 0 0 16px rgba(0, 242, 254, 0.4); }
    .tier-C-glow { box-shadow: 0 0 16px rgba(0, 255, 136, 0.4); }
    .tier-D-glow { box-shadow: 0 0 16px rgba(181, 23, 158, 0.4); }

    /* Ranks */
    .rank-gold {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #000;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
      border: 1px solid #ffe066;
    }
    .rank-silver {
      background: linear-gradient(135deg, #f1f5f9, #94a3b8);
      color: #0f172a;
      box-shadow: 0 0 12px rgba(148, 163, 184, 0.5);
      border: 1px solid #cbd5e1;
    }
    .rank-bronze {
      background: linear-gradient(135deg, #f97316, #9a3412);
      color: #fff;
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.5);
      border: 1px solid #fdba74;
    }
    .rank-default {
      background: #181d30;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Modal Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-sheet {
      width: 100%;
      max-width: 520px;
      background: #0d1120;
      border-top: 1px solid rgba(0, 242, 254, 0.35);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.9);
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      padding-bottom: calc(var(--safe-bottom) + 30px);
    }
    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    /* Floating WhatsApp Button */
    #floating-whatsapp {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 16px);
      right: 16px;
      z-index: 900;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff;
      border-radius: 9999px;
      padding: 9px 16px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 12.5px;
      box-shadow: 0 10px 24px rgba(37, 211, 102, 0.45);
      text-decoration: none;
      transition: all 0.2s ease;
    }
    #floating-whatsapp:active {
      transform: scale(0.95);
    }

    /* Toast */
    #toast-msg {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 26px);
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #090c16;
      color: #fff;
      border: 1px solid rgba(0, 242, 254, 0.5);
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      border-radius: 9999px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 800;
      z-index: 2000;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      pointer-events: none;
    }
    #toast-msg.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Scrollbars */
    ::-webkit-scrollbar { display: none; }

    function formatNumber(num) {
      if (!num || isNaN(num)) return "0";
      if (num >= 1e9) return (num / 1e9).toFixed(1) + "B";
      if (num >= 1e6) return (num / 1e6).toFixed(1) + "M";
      if (num >= 1e3) return (num / 1e3).toFixed(1) + "K";
      return num.toLocaleString();
    }

    function formatUSD(num) {
      if (!num || isNaN(num)) return "$0";
      return "$" + Math.round(num).toLocaleString();
    }

    function showToast(text) {
      const el = document.getElementById("toast-msg");
      if (!el) return;
      el.innerText = text;
      el.classList.add("show");
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        el.classList.remove("show");
      }, 2500);
    }

    function copyToClipboard(text, msg = "تم النسخ بنجاح! 📋") {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
      } else {
        fallbackCopy(text, msg);
      }
    }

    function fallbackCopy(text, msg) {
      const input = document.createElement("textarea");
      input.value = text;
      document.body.appendChild(input);
      input.select();
      try {
        document.execCommand("copy");
        showToast(msg);
      } catch (err) {
        showToast("فشل النسخ");
      }
      document.body.removeChild(input);
    }

    function openTikTokUrl(url, username) {
      let target = (url || "").trim();
      if (!target || target === "#" || target.toLowerCase() === "null" || target.toLowerCase() === "undefined") {
        target = "https://www.tiktok.com/@" + (username || "").replace(/^@/, "");
      }
      if (!target.startsWith("http://") && !target.startsWith("https://")) {
        target = "https://" + target.replace(/^\/+/, "");
      }
      
      showToast("جاري الفتح في تيك توك 🚀");
      try {
        if (window.Telegram?.WebApp?.openLink) {
          window.Telegram.WebApp.openLink(target);
          return;
        }
      } catch (e) {
        console.error("Telegram openLink error:", e);
      }
      window.open(target, "_blank", "noopener,noreferrer");
    }

    async function fetchLeaguesData(isManual = false) {
      if (isManual) showToast("جاري تحديث البيانات... 🔄");
      try {
        const res = await fetch('/api/leagues?_t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
        });
        const data = await res.json();
        if (data && data.leagues) {
          AppState.leagues = data.leagues;
          LEAGUE_NAMES.forEach(k => {
            if (!AppState.leagues[k]) AppState.leagues[k] = [];
          });
          renderApp();
          if (isManual) {
            let total = 0;
            Object.values(data.leagues).forEach(arr => total += (arr || []).length);
            showToast(`✅ تم التحديث! (${total} حساب)`);
          }
        }
      } catch (err) {
        console.error("Error fetching leagues:", err);
        if (isManual) showToast("تعذر التحديث من السيرفر");
      }
    }

      try {

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData })
        });
        const auth = await res.json();
        if (auth && auth.authorized === false) {
          showSubscriptionLock(auth.message);
        }
      } catch (e) {
        console.log("Verify error:", e);
      }

    async function submitRedeemCode() {
      const input = document.getElementById("sub-code-input");
      const btn = document.getElementById("sub-redeem-btn");
      const msg = document.getElementById("sub-redeem-msg");
      const code = (input?.value || "").trim();
      if (!code) {
        alert("يرجى إدخال كود التفعيل");
        return;
      }
      btn.disabled = true;
      btn.innerText = "جاري التفعيل...";
      try {
        const res = await fetch('/api/redeem', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: window.Telegram?.WebApp?.initData || '',
            code: code
          })
        });
        const data = await res.json();
        if (data && data.success) {
          alert("🎉 تم تفعيل اشتراكك بنجاح!");
          window.location.reload();
        } else {
          msg.style.display = "block";
          msg.style.color = "#ef4444";
          msg.innerText = data.message || "الكود غير صحيح";
          btn.disabled = false;
          btn.innerText = "تفعيل الكود الآن ⚡";
        }
      } catch (e) {
        alert("خطأ أثناء الاتصال: " + e.message);
        btn.disabled = false;
        btn.innerText = "تفعيل الكود الآن ⚡";
      }
    }

    function renderLeagueDetail() {
      const leagueKey = AppState.selectedLeague;
      const rawAccounts = AppState.leagues[leagueKey] || [];
      const q = AppState.leagueSearchQuery.trim().toLowerCase();

      let accounts = rawAccounts.filter(acc => {
        if (!q) return true;
        const name = (acc.creatorName || "").toLowerCase();
        const user = (acc.username || "").toLowerCase();
        const rank = String(acc.rank || "");
        return name.includes(q) || user.includes(q) || rank.includes(q);

      if (AppState.sortBy === "diamonds") {
        accounts.sort((a, b) => (b.diamonds || 0) - (a.diamonds || 0));
      } else if (AppState.sortBy === "earnings") {
        accounts.sort((a, b) => (b.earnings || 0) - (a.earnings || 0));

      const pass = (input?.value || "").trim();
      if (pass === "admin123") {
        AppState.isAdmin = true;

    function renderAdminDashboard(container) {
      container.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="background:#090d1c;border:1px solid rgba(0,242,254,0.3);border-radius:14px;padding:14px;text-align:center;">
            <div style="font-size:26px;margin-bottom:5px;">📤</div>
            <div style="font-size:13.5px;font-weight:900;color:#fff;margin-bottom:3px;">رفع ملف إكسل الليجات</div>
            <p style="font-size:10.5px;color:#94a3b8;margin-bottom:12px;">الملفات المدعومة: .xlsx, .xls, .csv</p>
            
            <input type="file" id="admin-file-input" accept=".xlsx,.xls,.csv" style="display:none;" onchange="handleExcelUpload(event)" />
            <button onclick="document.getElementById('admin-file-input').click()" style="width:100%;height:42px;border-radius:11px;background:linear-gradient(135deg,#00f2fe,#2d9bff);color:#000;font-weight:900;font-size:12.5px;border:none;cursor:pointer;">
              اختر ملف الإكسل لرفعه الآن
            </button>
          </div>

          <div style="display:grid;grid-template-columns:repeat(2, 1fr);gap:9px;">
            <button onclick="exportLeaguesJSON()" class="card-3d" style="height:42px;background:#151a30;color:#fff;font-weight:800;font-size:11.5px;cursor:pointer;">
              📥 تصدير JSON
            </button>
            <button onclick="clearAllDataServer()" class="card-3d" style="height:42px;background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4);color:#ef4444;font-weight:900;font-size:11.5px;cursor:pointer;">
              🗑️ مسح وتصفير
            </button>
          </div>

          <button onclick="AppState.isAdmin=false;closeAdminModal();showToast('تم الخروج من وضع الأدمن');" style="background:#1f2937;color:#9ca3af;border:none;border-radius:11px;padding:11px;font-weight:700;font-size:11.5px;cursor:pointer;width:100%;">
            تسجيل الخروج من الأدمن
          </button>
        </div>
      `;
    }

    async function handleExcelUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      showToast("⏳ جاري رفع وقراءة ملف الإكسل...");
      const formData = new FormData();
      formData.append("file", file);
      formData.append("password", "admin123");

      try {
        const res = await fetch("/api/admin/upload", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        if (data && data.success) {
          showToast("✅ " + data.message);
          closeAdminModal();
          await fetchLeaguesData(false);
        } else {
          alert("خطأ: " + (data.detail || data.message || "فشل معالجة الملف"));
        }
      } catch (err) {
        alert("حدث خطأ أثناء الرفع: " + err.message);
      }
      event.target.value = "";
    }

    async function clearAllDataServer() {
      if (!confirm("⚠️ هل أنت متأكد تماماً من مسح كافة بيانات الحسابات من السيرفر؟")) return;
      showToast("جاري مسح البيانات...");
      try {
        const res = await fetch("/api/admin/clear", { method: "POST" });
        const data = await res.json();
        if (data && data.success) {
          showToast("🗑️ تم تصفير البيانات بنجاح!");
          LEAGUE_NAMES.forEach(k => AppState.leagues[k] = []);
          renderApp();
          closeAdminModal();
        }
      } catch (e) {
        alert("حدث خطأ أثناء المسح: " + e.message);
      }
    }

    function exportLeaguesJSON() {
      const allAccs = Object.values(AppState.leagues).flat();
      const blob = new Blob([JSON.stringify(allAccs, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `tiktok_leagues_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("تم تصدير ملف JSON بنجاح! 📥");
    }

    function renderApp() {
      const root = document.getElementById("app");
      if (!root) return;

      let html = "";
      html += renderHeader();

      if (!AppState.selectedLeague) {
        html += renderStatsCards();
        html += renderLeaguesGrid();
      } else {
        html += renderLeagueDetail();
      }

      root.innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (window.Telegram?.WebApp) {
        try {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        } catch(e){}
      }
      renderApp();
      fetchLeaguesData(false);
      checkSubscription();
    });
  </script>
</body>
</html>
